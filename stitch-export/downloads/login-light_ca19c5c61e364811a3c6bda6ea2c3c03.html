<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Intervoice</title>

                    },
                    "borderRadius": {

<style>
        body {
            background-color: #ffffff; /* Override background to pure white as requested */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-surface antialiased min-h-screen flex flex-col justify-center items-center p-gutter">
<!-- Main Container -->
<main class="w-full max-w-[400px] flex flex-col gap-xl">
<!-- Header / Logo -->
<header class="flex flex-col items-center text-center gap-md">
<div class="w-16 h-16 rounded-lg bg-surface-container-lowest flex items-center justify-center border border-outline-variant shadow-sm mb-sm">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    graphic_eq
                </span>
</div>
<div>
<h1 class="font-display text-display text-on-surface">Intervoice</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Secure Access Portal</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-lg w-full">
<div class="flex flex-col gap-md">
<!-- Account Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface" for="account">Account</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow outline-none h-12" id="account" name="account" placeholder="Username or Email" type="text"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-label-bold text-label-bold text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm pr-12 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow outline-none h-12" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary rounded-lg h-12 flex items-center justify-center gap-sm hover:bg-primary transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary font-h3 text-h3" type="submit">
                Login
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-md my-xs">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-surface-container-lowest border border-outline-variant text-primary rounded-lg h-12 flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors font-h3 text-h3 shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]">chat</span>
                WeChat Login
            </button>
</form>
<!-- Footer -->
<footer class="text-center mt-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                By logging in, you agree to our <a class="text-primary hover:underline" href="#">Privacy Policy</a> and <a class="text-primary hover:underline" href="#">Terms of Service</a>.
            </p>
</footer>
</main>
</body></html>
